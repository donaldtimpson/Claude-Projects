<link rel="stylesheet" href="fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:832px; height:466px; overflow:hidden; }
  .card { position:relative; width:832px; height:466px;
          background:
            radial-gradient(105% 95% at 74% 40%, #5a1d1d 0%, #3a1414 30%, #220c0c 62%, #120505 100%);
          font-family:'Cinzel', serif; }
  /* parchment-grain + vignette */
  .grain { position:absolute; inset:0; opacity:.16; mix-blend-mode:overlay;
           background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.55'/></svg>"); }
  .vig { position:absolute; inset:0;
         background:radial-gradient(88% 78% at 52% 44%, transparent 34%, rgba(12,4,4,.86) 100%); }
  svg.art { position:absolute; inset:0; }
</style>
<div class="card">
  <div class="grain"></div>
  <div class="vig"></div>
  <svg class="art" width="832" height="466" viewBox="0 0 832 466" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e8cb7e"/><stop offset=".5" stop-color="#cfa135"/><stop offset="1" stop-color="#9a7209"/>
      </linearGradient>
      <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ddb954"/><stop offset="1" stop-color="#8a6408"/>
      </linearGradient>
      <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e6d5ad"/><stop offset="1" stop-color="#b99b63"/>
      </linearGradient>
      <linearGradient id="pageR" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#dcc79b"/><stop offset="1" stop-color="#a98d59"/>
      </linearGradient>
      <linearGradient id="quill" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f0e3c2"/><stop offset="1" stop-color="#9c8047"/>
      </linearGradient>
      <radialGradient id="glow" cx="50%" cy="50%">
        <stop offset="0" stop-color="#cfa135" stop-opacity=".30"/><stop offset="1" stop-color="#cfa135" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <ellipse cx="592" cy="250" rx="235" ry="200" fill="url(#glow)"/>

    <!-- ══ ornate frame ══ -->
    <rect x="12" y="12" width="808" height="442" fill="none" stroke="url(#gold)" stroke-width="2.2" opacity=".92"/>
    <rect x="19" y="19" width="794" height="428" fill="none" stroke="#cfa135" stroke-width=".8" opacity=".55"/>
    <g stroke="url(#gold)" fill="none" stroke-width="1.5" opacity=".95" stroke-linecap="round">
      <!-- corner filigree, one group mirrored to all four corners -->
      <g id="cnr">
        <path d="M12 44 C12 26 26 12 44 12"/>
        <path d="M22 46 C22 33 33 22 46 22" stroke-width="1"/>
        <path d="M30 44 c0 -8 6 -14 14 -14" stroke-width="1"/>
        <path d="M34 34 c5 -2 10 0 12 4 c-5 1 -8 5 -8 10 c-3 -4 -8 -6 -12 -5 c3 -3 4 -6 3 -9 z" fill="url(#goldSoft)" stroke="none" opacity=".85"/>
        <path d="M52 18 c9 2 15 8 17 17" stroke-width="1"/>
        <path d="M18 52 c2 9 8 15 17 17" stroke-width="1"/>
        <circle cx="30.5" cy="30.5" r="1.8" fill="url(#gold)" stroke="none"/>
      </g>
      <use href="#cnr" transform="translate(832,0) scale(-1,1)"/>
      <use href="#cnr" transform="translate(0,466) scale(1,-1)"/>
      <use href="#cnr" transform="translate(832,466) scale(-1,-1)"/>
    </g>
    <!-- tiny corner marks, as on the other plates -->
    <g font-family="EBG, serif" font-size="7" fill="#cfa135" opacity=".55" font-style="italic">
      <text x="27" y="20">a</text><text x="799" y="20" text-anchor="end">a</text>
      <text x="27" y="452">b</text><text x="799" y="452" text-anchor="end">b</text>
    </g>

    <!-- ══════════ RIGHT: the plate ══════════ -->
    <!-- open book -->
    <g transform="translate(600,300)">
      <ellipse cx="0" cy="88" rx="182" ry="22" fill="#0a0303" opacity=".7"/>
      <!-- page stacks -->
      <path d="M-168 62 C-110 40 -48 38 0 58 C48 38 110 40 168 62 L168 74 C110 54 48 52 0 72 C-48 52 -110 54 -168 74 Z" fill="#6d5730" stroke="#3d2c12" stroke-width="1.2" opacity=".95"/>
      <!-- left leaf -->
      <path d="M-166 58 C-108 36 -46 34 0 54 L0 -46 C-46 -66 -108 -64 -166 -42 Z" fill="url(#page)" stroke="#4a3617" stroke-width="1.6"/>
      <!-- right leaf -->
      <path d="M166 58 C108 36 46 34 0 54 L0 -46 C46 -66 108 -64 166 -42 Z" fill="url(#pageR)" stroke="#4a3617" stroke-width="1.6"/>
      <!-- spine -->
      <path d="M0 54 L0 -46" stroke="#6b5528" stroke-width="1.6" opacity=".85"/>
      <!-- ruled text on the left leaf -->
      <g stroke="#4a3617" stroke-width="1.6" opacity=".72" stroke-linecap="round">
        <path d="M-150 -30 C-112 -40 -74 -44 -36 -40"/>
        <path d="M-150 -18 C-112 -28 -74 -32 -36 -28"/>
        <path d="M-150 -6 C-112 -16 -74 -20 -36 -16"/>
        <path d="M-150 6 C-118 -2 -86 -6 -54 -4"/>
        <path d="M-150 18 C-112 10 -74 6 -36 8"/>
        <path d="M-150 30 C-124 24 -98 21 -72 21"/>
      </g>
      <!-- illuminated capital + parsed line on the right leaf -->
      <text x="34" y="-16" font-family="Cinzel, serif" font-size="30" font-weight="700" fill="#7a3030" opacity=".92">A</text>
      <g stroke="#4a3617" stroke-width="1.6" opacity=".72" stroke-linecap="round">
        <path d="M70 -30 C102 -37 132 -40 152 -38"/>
        <path d="M70 -18 C102 -25 132 -28 152 -26"/>
        <path d="M36 -2 C78 -10 118 -14 152 -12"/>
        <path d="M36 10 C78 2 118 -2 152 0"/>
      </g>
      <!-- the parsing braces: grammar's own diagram -->
      <g stroke="#7a3030" stroke-width="1.4" fill="none" opacity=".8">
        <path d="M44 26 v6 h44 v-6"/><path d="M66 32 v7"/>
        <path d="M100 24 v6 h44 v-6"/><path d="M122 30 v7"/>
      </g>
      <g font-family="EBG, serif" font-size="9" fill="#6b4a2a" opacity=".9" text-anchor="middle">
        <text x="66" y="49">noun</text><text x="122" y="47">verb</text>
      </g>
    </g>

    <!-- inkwell, clear of the book and in front -->
    <g transform="translate(408,368)">
      <ellipse cx="2" cy="30" rx="40" ry="10" fill="#0a0303" opacity=".72"/>
      <path d="M-26 -4 h52 l-6 30 a26 9 0 0 1 -40 0 z" fill="#2c1d0c" stroke="url(#gold)" stroke-width="1.5"/>
      <ellipse cx="0" cy="-4" rx="26" ry="8.5" fill="#1b1105" stroke="url(#gold)" stroke-width="1.5"/>
      <ellipse cx="0" cy="-3" rx="19" ry="5.6" fill="#080706"/>
      <ellipse cx="-6" cy="-5" rx="6" ry="2" fill="#e8cb7e" opacity=".22"/>
    </g>

    <!-- quill standing in the ink -->
    <g transform="translate(404,352) rotate(-24)">
      <path d="M0 0 C22 -34 52 -96 66 -164 C74 -96 44 -34 14 6 Z" fill="url(#quill)" stroke="#4a3617" stroke-width="1.4"/>
      <path d="M4 -2 C24 -36 52 -98 66 -164" stroke="#6b5528" stroke-width="1.2" fill="none" opacity=".95"/>
      <g stroke="#6b5528" stroke-width=".8" opacity=".6">
        <path d="M12 -22 C24 -34 34 -50 40 -66"/><path d="M20 -44 C32 -56 42 -72 48 -88"/>
        <path d="M28 -68 C40 -80 48 -94 54 -110"/><path d="M38 -96 C48 -108 55 -120 60 -134"/>
      </g>
      <path d="M0 0 L-5 12" stroke="#e8cb7e" stroke-width="3" stroke-linecap="round"/>
      <path d="M-3 8 L-6 15" stroke="#1b1105" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- the alphabet as raw material, kept faint -->
    <g font-family="Cinzel, serif" fill="#cfa135" opacity=".22">
      <text x="752" y="112" font-size="27">A</text>
      <text x="790" y="152" font-size="18">B</text>
      <text x="716" y="80" font-size="15">Γ</text>
    </g>

    <!-- ══════════ LEFT: the type ══════════ -->
    <!-- lyre in laurel emblem -->
    <g transform="translate(178,74)">
      <g stroke="url(#gold)" fill="none" stroke-width="1.7" stroke-linecap="round">
        <path d="M-11 22 C-30 12 -38 -6 -35 -24"/>
        <path d="M11 22 C30 12 38 -6 35 -24"/>
      </g>
      <g fill="url(#goldSoft)" opacity=".95">
        <path d="M-33 -20 c-7 -4 -11 -10 -10 -17 c7 -1 13 3 16 10 z"/>
        <path d="M-30 -8 c-8 -3 -12 -9 -12 -16 c7 0 13 4 16 11 z"/>
        <path d="M-25 4 c-8 -2 -13 -8 -14 -15 c7 0 13 3 17 10 z"/>
        <path d="M-18 14 c-8 -1 -14 -6 -16 -13 c7 -1 13 2 18 8 z"/>
        <path d="M33 -20 c7 -4 11 -10 10 -17 c-7 -1 -13 3 -16 10 z"/>
        <path d="M30 -8 c8 -3 12 -9 12 -16 c-7 0 -13 4 -16 11 z"/>
        <path d="M25 4 c8 -2 13 -8 14 -15 c-7 0 -13 3 -17 10 z"/>
        <path d="M18 14 c8 -1 14 -6 16 -13 c-7 -1 -13 2 -18 8 z"/>
      </g>
      <g stroke="url(#gold)" fill="none" stroke-width="2">
        <path d="M-16 12 C-22 -6 -20 -18 -12 -26"/>
        <path d="M16 12 C22 -6 20 -18 12 -26"/>
        <path d="M-12 -26 C-6 -30 6 -30 12 -26"/>
        <path d="M-17 12 L17 12"/>
      </g>
      <g stroke="url(#gold)" stroke-width="1">
        <path d="M-8 10 L-6 -24"/><path d="M-2.5 10 L-2 -26"/><path d="M2.5 10 L2 -26"/><path d="M8 10 L6 -24"/>
      </g>
    </g>

    <g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity=".85">
      <path d="M96 258 h58"/><path d="M202 258 h58"/>
      <path d="M170 258 l8 -6 l8 6 l-8 6 z" fill="url(#goldSoft)" stroke="none"/>
      <circle cx="161" cy="258" r="1.7" fill="url(#gold)" stroke="none"/>
      <circle cx="195" cy="258" r="1.7" fill="url(#gold)" stroke="none"/>
    </g>
  </svg>

  <div style="position:absolute; left:0; top:104px; width:356px; text-align:center;
              font-family:'Cinzel',serif; color:#e8cb7e; font-size:16.5px; letter-spacing:.20em; line-height:1.55;
              text-shadow:0 1px 3px rgba(0,0,0,.7);">
    THE TIMPSON<br>LYCEUM
  </div>

  <div style="position:absolute; left:0; top:178px; width:356px; text-align:center;
              font-family:'Cinzel',serif; font-weight:700; font-size:46px; letter-spacing:.045em;
              background:linear-gradient(180deg,#f0dda2 0%,#cfa135 52%,#8a6408 100%);
              -webkit-background-clip:text; background-clip:text; color:transparent;
              filter:drop-shadow(0 2px 4px rgba(0,0,0,.75));">
    LANGUAGE
  </div>

  <div style="position:absolute; left:0; top:236px; width:356px; text-align:center;
              font-family:'Cinzel',serif; color:#ddb954; font-size:13.5px; letter-spacing:.155em;
              text-shadow:0 1px 3px rgba(0,0,0,.7);">
    THE RULE OF SPEECH
  </div>

  <div style="position:absolute; left:0; top:288px; width:356px; text-align:center;
              font-family:'EBG',serif; font-style:italic; color:#e2d3ae; font-size:15.5px; line-height:1.62;
              text-shadow:0 1px 3px rgba(0,0,0,.7);">
    Usus, quem penes arbitrium est<br>et ius et norma loquendi.
  </div>

  <div style="position:absolute; left:0; top:352px; width:356px; text-align:center;
              font-family:'Cinzel',serif; color:#c4af8e; font-size:10.5px; letter-spacing:.13em;
              text-shadow:0 1px 3px rgba(0,0,0,.7);">
    — HORACE, ARS POETICA
  </div>
</div>
