<script type="text/markdown" id="src"># Linear Algebra — Lecture Notes

**Text:** Lay, *Linear Algebra and Its Applications*, 5th ed.
**Chapter 1 — Linear Equations in Linear Algebra**
**Sections covered:** 1.3 Vector Equations · 1.4 The Matrix Equation $A\mathbf x = \mathbf b$

> *Where this sits:* §1.1–1.2 gave an algorithm for *solving* a system. §1.3–1.4 change the **point of view**: the same system is recast first as a **vector equation** (a question about linear combinations and *span*), then as a **matrix equation** $A\mathbf x=\mathbf b$. The punchline (Theorem 3) is that these are **three descriptions of one problem** — free to switch between them. Everything downstream (linear independence §1.7, linear transformations §1.8–1.9, and later column space, rank, eigenvectors) is spoken in this vector/matrix language, so this is the lecture where the course's vocabulary is set. We also front-load the abstract notion of a **vector space** (which Lay defers to Ch. 4): naming its axioms lets us *prove* the arithmetic of $\mathbb R^n$ rather than merely list it.

---

## §1.3 — Vector Equations

### What a vector space is

We are about to lean on a handful of algebraic rules for adding and scaling vectors. Rather than list them as unproven facts about $\mathbb R^n$, we name the structure they define — then $\mathbb R^n$ becomes a *theorem*, not a list. Lay defers this to Chapter 4; we plant the flag now, so that from here on **"vector" means "element of a vector space,"** not merely "arrow."

> **📗 DEFINITION.** A **vector space** is a nonempty set $V$ of objects, called **vectors**, equipped with two operations — **addition** $(\mathbf u,\mathbf v)\mapsto \mathbf u+\mathbf v$ and **scalar multiplication** $(c,\mathbf u)\mapsto c\mathbf u$ (with $c$ a real **scalar**) — subject to the following axioms, which must hold for all $\mathbf u,\mathbf v,\mathbf w\in V$ and all scalars $c,d$:
> | | |
> |---|---|
> | **1.** $\mathbf u+\mathbf v\in V$ *(closed under addition)* | **6.** $c\mathbf u\in V$ *(closed under scalar mult.)* |
> | **2.** $\mathbf u+\mathbf v=\mathbf v+\mathbf u$ | **7.** $c(\mathbf u+\mathbf v)=c\mathbf u+c\mathbf v$ |
> | **3.** $(\mathbf u+\mathbf v)+\mathbf w=\mathbf u+(\mathbf v+\mathbf w)$ | **8.** $(c+d)\mathbf u=c\mathbf u+d\mathbf u$ |
> | **4.** there is a **zero vector** $\mathbf 0\in V$ with $\mathbf u+\mathbf 0=\mathbf u$ | **9.** $c(d\mathbf u)=(cd)\mathbf u$ |
> | **5.** each $\mathbf u$ has a **negative** $-\mathbf u\in V$ with $\mathbf u+(-\mathbf u)=\mathbf 0$ | **10.** $1\mathbf u=\mathbf u$ |

> **💡 Why bother abstracting?** Anything proved from these axioms *alone* holds in **every** vector space at once. And many important sets are vector spaces beyond arrows-of-numbers: all polynomials of degree $\le n$, all $m\times n$ matrices, all real-valued functions on an interval, all solutions of a linear homogeneous differential equation. Prove it once here; reuse it everywhere in Chapter 4.

### Consequences of the axioms (proved, not assumed)

The axioms are deliberately spare — they assert *a* zero and *a* negative exist, and how addition and scaling interact. Everything else is a theorem. The following hold in **any** vector space $V$.

> **📐 PROPOSITION.** Let $V$ be a vector space, $\mathbf u\in V$, $c$ a scalar. Then
> **(a)** the zero vector is **unique**; **(b)** each $\mathbf u$ has a **unique** negative; **(c)** $0\mathbf u=\mathbf 0$; **(d)** $c\mathbf 0=\mathbf 0$; **(e)** $(-1)\mathbf u=-\mathbf u$.

> **🔎 Proof.**
> **(a)** Suppose $\mathbf 0$ and $\mathbf 0'$ both satisfy axiom 4. Then $\mathbf 0=\mathbf 0+\mathbf 0'$ (using $\mathbf 0'$ as a zero) $=\mathbf 0'+\mathbf 0$ (axiom 2) $=\mathbf 0'$ (using $\mathbf 0$ as a zero). So $\mathbf 0=\mathbf 0'$.
>
> **(b)** Suppose $\mathbf w$ and $\mathbf w'$ are both negatives of $\mathbf u$. Then
> $$\mathbf w=\mathbf w+\mathbf 0=\mathbf w+(\mathbf u+\mathbf w')=(\mathbf w+\mathbf u)+\mathbf w'=(\mathbf u+\mathbf w)+\mathbf w'=\mathbf 0+\mathbf w'=\mathbf w'+\mathbf 0=\mathbf w',$$
> using axioms 4, 5, 3, 2, 5, 2, 4 in turn. So the negative is unique.
>
> **(c)** $0\mathbf u=(0+0)\mathbf u=0\mathbf u+0\mathbf u$ (axiom 8). Add $-(0\mathbf u)$ to both sides and regroup with axiom 3:
> $$\mathbf 0=0\mathbf u+\big(-(0\mathbf u)\big)=\big(0\mathbf u+0\mathbf u\big)+\big(-(0\mathbf u)\big)=0\mathbf u+\Big(0\mathbf u+\big(-(0\mathbf u)\big)\Big)=0\mathbf u+\mathbf 0=0\mathbf u.$$
>
> **(d)** Identically: $c\mathbf 0=c(\mathbf 0+\mathbf 0)=c\mathbf 0+c\mathbf 0$ (axiom 7), and the same cancellation gives $c\mathbf 0=\mathbf 0$.
>
> **(e)** Compute $\mathbf u+(-1)\mathbf u=1\mathbf u+(-1)\mathbf u$ (axiom 10) $=(1+(-1))\mathbf u$ (axiom 8) $=0\mathbf u=\mathbf 0$ (part (c)). So $(-1)\mathbf u$ is a negative of $\mathbf u$; by the uniqueness in (b), $(-1)\mathbf u=-\mathbf u$. $\blacksquare$

Part (e) is what licenses the shorthand $-\mathbf u:=(-1)\mathbf u$ and $\mathbf u-\mathbf v:=\mathbf u+(-1)\mathbf v$.

### $\mathbb R^n$ is a vector space

Now the example this whole course runs on.

**Column vector.** A matrix with a single column. **$\mathbb R^n$** (read "r-n") is the set of all lists of $n$ real numbers, written as $n\times1$ column matrices; its elements are **vectors**:
$$\mathbf u=\begin{bmatrix}u_1\\\vdots\\u_n\end{bmatrix}.$$
Define the two operations **entrywise**: $\mathbf u+\mathbf v$ has $i$-th entry $u_i+v_i$, and $c\mathbf u$ has $i$-th entry $cu_i$. **Equality is entrywise:** two vectors of $\mathbb R^n$ are equal iff all corresponding entries are equal.

> **📐 THEOREM.** With entrywise addition and scalar multiplication, $\mathbb R^n$ is a vector space.

> **🔎 Proof.** Verify the ten axioms. **Closure** (1, 6): a sum, or a scalar multiple, of lists of $n$ reals is again a list of $n$ reals — the results are in $\mathbb R^n$. For the remaining eight, each axiom asserts that two vectors are equal, and by entrywise equality it suffices to check the $i$-th entry for arbitrary $i$; every such check collapses to a field axiom of $\mathbb R$:
> | Axiom | $i$-th entry reduces to | law used in $\mathbb R$ |
> |---|---|---|
> | 2 | $u_i+v_i=v_i+u_i$ | commutativity of $+$ |
> | 3 | $(u_i+v_i)+w_i=u_i+(v_i+w_i)$ | associativity of $+$ |
> | 4 | with $\mathbf 0=(0,\dots,0)$: $u_i+0=u_i$ | additive identity |
> | 5 | with $-\mathbf u=(-u_1,\dots,-u_n)$: $u_i+(-u_i)=0$ | additive inverse |
> | 7 | $c(u_i+v_i)=cu_i+cv_i$ | distributivity |
> | 8 | $(c+d)u_i=cu_i+du_i$ | distributivity |
> | 9 | $c(d\,u_i)=(cd)u_i$ | associativity of $\times$ |
> | 10 | $1\cdot u_i=u_i$ | multiplicative identity |
>
> All ten hold, so $\mathbb R^n$ is a vector space. $\blacksquare$

The unproven "properties list" is now a proved theorem; the zero vector is concretely $(0,\dots,0)$ and $-\mathbf u$ is entrywise negation.

> **✋ Notation.** For convenience a column vector $\begin{bmatrix}3\\-1\end{bmatrix}$ is sometimes written on one line as $(3,-1)$ — parentheses and commas. This is **not** the $1\times2$ row matrix $\begin{bmatrix}3&-1\end{bmatrix}$ (brackets, no comma): $\begin{bmatrix}3\\-1\end{bmatrix}\ne\begin{bmatrix}3&-1\end{bmatrix}$ — different shapes, same entries.

#### Example 1 — computing in $\mathbb R^n$ (worked)

Let $\mathbf u=\begin{bmatrix}1\\-2\end{bmatrix},\ \mathbf v=\begin{bmatrix}2\\-5\end{bmatrix}$. Find $4\mathbf u$, $(-3)\mathbf v$, and $4\mathbf u+(-3)\mathbf v$.
$$
4\mathbf u=\begin{bmatrix}4\\-8\end{bmatrix},\qquad
(-3)\mathbf v=\begin{bmatrix}-6\\15\end{bmatrix},\qquad
4\mathbf u+(-3)\mathbf v=\begin{bmatrix}4\\-8\end{bmatrix}+\begin{bmatrix}-6\\15\end{bmatrix}=\begin{bmatrix}-2\\7\end{bmatrix}.
$$

### The concrete cases: $\mathbb R^2$ and $\mathbb R^3$

For $n=2,3$ the vector space can be *drawn*. Identify the vector $\begin{bmatrix}a\\b\end{bmatrix}$ with the geometric point $(a,b)$, so $\mathbb R^2$ **is** the plane of points and $\mathbb R^3$ the points of space; a vector is often drawn as an arrow from the origin to that point. Because equality is entrywise, $\begin{bmatrix}4\\7\end{bmatrix}\ne\begin{bmatrix}7\\4\end{bmatrix}$ — vectors in $\mathbb R^2$ are *ordered* pairs.

> **📦 Parallelogram Rule for Addition.** If $\mathbf u$ and $\mathbf v$ in $\mathbb R^2$ are drawn as points, then $\mathbf u+\mathbf v$ is the fourth vertex of the parallelogram whose other three vertices are $\mathbf 0$, $\mathbf u$, and $\mathbf v$.

**Scalar multiples geometrically.** The arrow for $c\mathbf u$ is $|c|$ times as long as the arrow for $\mathbf u$ — same direction if $c>0$, opposite if $c<0$. Consequently:

> **💡 Key picture.** The set of **all** scalar multiples of a fixed nonzero vector $\mathbf u$ is the **line through the origin** and $\mathbf u$. (The length of the arrow from $(0,0)$ to $(a,b)$ is $\sqrt{a^2+b^2}$ — revisited in Ch. 6.)

### Linear combinations — the central definition

> **📗 DEFINITION.** Given vectors $\mathbf v_1,\dots,\mathbf v_p\in\mathbb R^n$ and scalars $c_1,\dots,c_p$, the vector
> $$\mathbf y=c_1\mathbf v_1+\cdots+c_p\mathbf v_p$$
> is a **linear combination** of $\mathbf v_1,\dots,\mathbf v_p$ with **weights** $c_1,\dots,c_p$.

The weights may be **any** real numbers, including zero. So $\sqrt3\,\mathbf v_1$, $\tfrac12\mathbf v_1\ (=\tfrac12\mathbf v_1+0\mathbf v_2)$, and $\mathbf 0\ (=0\mathbf v_1+0\mathbf v_2)$ are all linear combinations of $\mathbf v_1,\mathbf v_2$.

#### Example 5 — is $\mathbf b$ a linear combination? (worked)

Let $\mathbf a_1=\begin{bmatrix}1\\-2\\-5\end{bmatrix},\ \mathbf a_2=\begin{bmatrix}2\\5\\6\end{bmatrix},\ \mathbf b=\begin{bmatrix}7\\4\\-3\end{bmatrix}$. Do weights $x_1,x_2$ exist with $x_1\mathbf a_1+x_2\mathbf a_2=\mathbf b$?

Writing the vector equation entrywise gives the system $x_1+2x_2=7,\ -2x_1+5x_2=4,\ -5x_1+6x_2=-3$. Row reduce its augmented matrix:
$$
\begin{bmatrix}1&2&7\\-2&5&4\\-5&6&-3\end{bmatrix}
\longrightarrow
\begin{bmatrix}1&2&7\\0&9&18\\0&16&32\end{bmatrix}
\longrightarrow
\begin{bmatrix}1&0&3\\0&1&2\\0&0&0\end{bmatrix}.
$$
So $x_1=3,\ x_2=2$: **yes**, $\mathbf b=3\mathbf a_1+2\mathbf a_2$. **Check:** $3\begin{bmatrix}1\\-2\\-5\end{bmatrix}+2\begin{bmatrix}2\\5\\6\end{bmatrix}=\begin{bmatrix}3\\-6\\-15\end{bmatrix}+\begin{bmatrix}4\\10\\12\end{bmatrix}=\begin{bmatrix}7\\4\\-3\end{bmatrix}$ ✓.

> **📦 The fundamental fact (vector equation ⟷ augmented matrix).** A vector equation
> $$x_1\mathbf a_1+x_2\mathbf a_2+\cdots+x_n\mathbf a_n=\mathbf b$$
> has the **same solution set** as the linear system whose augmented matrix is $\begin{bmatrix}\mathbf a_1&\mathbf a_2&\cdots&\mathbf a_n&\mathbf b\end{bmatrix}$. In particular, $\mathbf b$ is a linear combination of $\mathbf a_1,\dots,\mathbf a_n$ **iff** that system is consistent.

> **🔎 Why.** By the definitions of scalar multiplication and vector addition, the $i$-th entry of the left side $x_1\mathbf a_1+\cdots+x_n\mathbf a_n$ is $a_{i1}x_1+\cdots+a_{in}x_n$, where $a_{ij}$ is the $i$-th entry of column $\mathbf a_j$. Setting the two vectors equal entry by entry is precisely the system of equations $a_{i1}x_1+\cdots+a_{in}x_n=b_i$ $(i=1,\dots,m)$ — the system with augmented matrix $[\,\mathbf a_1\ \cdots\ \mathbf a_n\ \mathbf b\,]$. The vector equation and the system make identical demands on $(x_1,\dots,x_n)$, so they have identical solution sets. $\blacksquare$

> **💡 Read the columns straight off.** You can write that augmented matrix *directly* from the vector equation — the vectors $\mathbf a_1,\dots,\mathbf a_n,\mathbf b$, in the order shown, become its columns. No intermediate algebra needed.

### Span

> **📗 DEFINITION.** For $\mathbf v_1,\dots,\mathbf v_p\in\mathbb R^n$, **Span**$\{\mathbf v_1,\dots,\mathbf v_p\}$ is the set of **all** linear combinations of $\mathbf v_1,\dots,\mathbf v_p$ — that is, all vectors of the form $c_1\mathbf v_1+\cdots+c_p\mathbf v_p$ with $c_1,\dots,c_p$ scalars. It is also called the subset of $\mathbb R^n$ **spanned (or generated) by** $\mathbf v_1,\dots,\mathbf v_p$.

Asking "**is $\mathbf b$ in Span$\{\mathbf v_1,\dots,\mathbf v_p\}$?**" is therefore the *same* question as "does $x_1\mathbf v_1+\cdots+x_p\mathbf v_p=\mathbf b$ have a solution?", i.e. "is the system $[\,\mathbf v_1\ \cdots\ \mathbf v_p\ \mathbf b\,]$ consistent?"

- Span$\{\mathbf v_1,\dots,\mathbf v_p\}$ always contains every scalar multiple $c\mathbf v_1$ (take $c\mathbf v_1+0\mathbf v_2+\cdots$) and always contains $\mathbf 0$.

> **💡 Geometric picture (in $\mathbb R^3$).**
> - For a nonzero $\mathbf v$, **Span**$\{\mathbf v\}$ is the **line** through the origin and $\mathbf v$.
> - For nonzero $\mathbf u,\mathbf v$ with $\mathbf v$ **not** a multiple of $\mathbf u$, **Span**$\{\mathbf u,\mathbf v\}$ is the **plane** through the origin containing $\mathbf u$ and $\mathbf v$.

#### Example 6 — a vector *not* in the span (worked)

Let $\mathbf a_1=\begin{bmatrix}1\\-2\\3\end{bmatrix},\ \mathbf a_2=\begin{bmatrix}5\\-13\\-3\end{bmatrix},\ \mathbf b=\begin{bmatrix}-3\\8\\1\end{bmatrix}$. Is $\mathbf b\in\text{Span}\{\mathbf a_1,\mathbf a_2\}$? Row reduce $[\,\mathbf a_1\ \mathbf a_2\ \mathbf b\,]$:
$$
\begin{bmatrix}1&5&-3\\-2&-13&8\\3&-3&1\end{bmatrix}
\longrightarrow
\begin{bmatrix}1&5&-3\\0&-3&2\\0&-18&10\end{bmatrix}
\longrightarrow
\begin{bmatrix}1&5&-3\\0&-3&2\\0&0&-2\end{bmatrix}.
$$
The last row is $0=-2$ — inconsistent. So $x_1\mathbf a_1+x_2\mathbf a_2=\mathbf b$ has no solution, and $\mathbf b$ is **not** in Span$\{\mathbf a_1,\mathbf a_2\}$ (it lies off the plane those two vectors span).

> **📝 Application flavor (Example 7).** Linear combinations model "total = (units)·(cost per unit)." If $\mathbf b,\mathbf c$ are the per-dollar cost vectors of two products, then $100\mathbf b$ is the cost of \$100 of the first product, and $x_1\mathbf b+x_2\mathbf c$ is the total cost of making \$$x_1$ of one and \$$x_2$ of the other. Scalar multiples scale a recipe; sums combine recipes.

## §1.4 — The Matrix Equation $A\mathbf x=\mathbf b$

The single idea of this section: **view a linear combination of vectors as a matrix times a vector.** This lets us write a whole system as one compact equation $A\mathbf x=\mathbf b$.

### The product $A\mathbf x$

> **📗 DEFINITION.** If $A$ is $m\times n$ with columns $\mathbf a_1,\dots,\mathbf a_n$, and $\mathbf x\in\mathbb R^n$, then the **product** $A\mathbf x$ is the linear combination of the columns of $A$ using the entries of $\mathbf x$ as weights:
> $$A\mathbf x=\begin{bmatrix}\mathbf a_1&\mathbf a_2&\cdots&\mathbf a_n\end{bmatrix}\begin{bmatrix}x_1\\\vdots\\x_n\end{bmatrix}=x_1\mathbf a_1+x_2\mathbf a_2+\cdots+x_n\mathbf a_n.$$

> **⚠ Dimension rule.** $A\mathbf x$ is defined **only if the number of columns of $A$ equals the number of entries in $\mathbf x$.** The result lives in $\mathbb R^m$ (as many entries as $A$ has rows).

#### Example 1 — $A\mathbf x$ from the definition (worked)

$$
\textbf{(a)}\quad\begin{bmatrix}1&2&-1\\0&-5&3\end{bmatrix}\begin{bmatrix}4\\3\\7\end{bmatrix}
=4\begin{bmatrix}1\\0\end{bmatrix}+3\begin{bmatrix}2\\-5\end{bmatrix}+7\begin{bmatrix}-1\\3\end{bmatrix}
=\begin{bmatrix}4\\0\end{bmatrix}+\begin{bmatrix}6\\-15\end{bmatrix}+\begin{bmatrix}-7\\21\end{bmatrix}
=\begin{bmatrix}3\\6\end{bmatrix}.
$$
$$
\textbf{(b)}\quad\begin{bmatrix}2&-3\\8&0\\-5&2\end{bmatrix}\begin{bmatrix}4\\7\end{bmatrix}
=4\begin{bmatrix}2\\8\\-5\end{bmatrix}+7\begin{bmatrix}-3\\0\\2\end{bmatrix}
=\begin{bmatrix}8\\32\\-20\end{bmatrix}+\begin{bmatrix}-21\\0\\14\end{bmatrix}
=\begin{bmatrix}-13\\32\\-6\end{bmatrix}.
$$

**Reverse direction (Example 2).** Any linear combination is a matrix–vector product: for $\mathbf v_1,\mathbf v_2,\mathbf v_3\in\mathbb R^m$,
$$3\mathbf v_1-5\mathbf v_2+7\mathbf v_3=\begin{bmatrix}\mathbf v_1&\mathbf v_2&\mathbf v_3\end{bmatrix}\begin{bmatrix}3\\-5\\7\end{bmatrix}=A\mathbf x.$$

### The matrix equation

Because $A\mathbf x$ is by definition the linear combination $x_1\mathbf a_1+\cdots+x_n\mathbf a_n$, a system $\to$ vector equation $\to$ matrix equation. E.g.
$$
\begin{aligned}x_1+2x_2-x_3&=4\\-5x_2+3x_3&=1\end{aligned}
\;\Longleftrightarrow\;
x_1\begin{bmatrix}1\\0\end{bmatrix}+x_2\begin{bmatrix}2\\-5\end{bmatrix}+x_3\begin{bmatrix}-1\\3\end{bmatrix}=\begin{bmatrix}4\\1\end{bmatrix}
\;\Longleftrightarrow\;
\begin{bmatrix}1&2&-1\\0&-5&3\end{bmatrix}\begin{bmatrix}x_1\\x_2\\x_3\end{bmatrix}=\begin{bmatrix}4\\1\end{bmatrix}.
$$
An equation of the form $A\mathbf x=\mathbf b$ is a **matrix equation** (distinct from a *vector* equation). Its coefficient matrix is exactly the system's matrix of coefficients.

> **📐 THEOREM 3 — three equivalent forms.** If $A$ is $m\times n$ with columns $\mathbf a_1,\dots,\mathbf a_n$ and $\mathbf b\in\mathbb R^m$, then the matrix equation
> $$A\mathbf x=\mathbf b$$
> has the **same solution set** as the vector equation
> $$x_1\mathbf a_1+x_2\mathbf a_2+\cdots+x_n\mathbf a_n=\mathbf b,$$
> which in turn has the same solution set as the linear system with augmented matrix $\begin{bmatrix}\mathbf a_1&\mathbf a_2&\cdots&\mathbf a_n&\mathbf b\end{bmatrix}$.

> **🔎 Proof.** By the definition of the product, $A\mathbf x=x_1\mathbf a_1+\cdots+x_n\mathbf a_n$ for *every* $\mathbf x\in\mathbb R^n$. Hence "$A\mathbf x=\mathbf b$" and "$x_1\mathbf a_1+\cdots+x_n\mathbf a_n=\mathbf b$" are the *same equation written two ways*, so they hold for exactly the same $\mathbf x$ — identical solution sets. The equivalence of the vector equation with the system of augmented matrix $[\,\mathbf a_1\ \cdots\ \mathbf a_n\ \mathbf b\,]$ is the fundamental fact proved in §1.3. Chaining the two gives the theorem. $\blacksquare$

> **💡 Why it's powerful.** One problem, three viewpoints — matrix equation, vector equation, system of equations. Model in whichever is most natural, then switch freely; **all three are solved the same way, by row reducing $[\,\mathbf a_1\ \cdots\ \mathbf a_n\ \mathbf b\,]$.**

### Existence of solutions

> **📦 Existence fact.** $A\mathbf x=\mathbf b$ has a solution **iff** $\mathbf b$ is a linear combination of the columns of $A$.

*Immediate from Theorem 3:* $A\mathbf x=\mathbf b$ is solvable $\iff x_1\mathbf a_1+\cdots+x_n\mathbf a_n=\mathbf b$ is solvable $\iff \mathbf b\in\text{Span}\{\mathbf a_1,\dots,\mathbf a_n\}$.

The sharper existence question is whether $A\mathbf x=\mathbf b$ is consistent **for every** $\mathbf b$.

#### Example 3 — consistent for *all* $\mathbf b$? (worked)

Let $A=\begin{bmatrix}1&3&4\\-4&2&-6\\-3&-2&-7\end{bmatrix}$, $\mathbf b=\begin{bmatrix}b_1\\b_2\\b_3\end{bmatrix}$. Row reduce $[\,A\ \mathbf b\,]$, carrying $\mathbf b$ symbolically:
$$
\begin{bmatrix}1&3&4&b_1\\-4&2&-6&b_2\\-3&-2&-7&b_3\end{bmatrix}
\longrightarrow
\begin{bmatrix}1&3&4&b_1\\0&14&10&b_2+4b_1\\0&7&5&b_3+3b_1\end{bmatrix}
\longrightarrow
\begin{bmatrix}1&3&4&b_1\\0&14&10&b_2+4b_1\\0&0&0&\,b_1-\tfrac12 b_2+b_3\,\end{bmatrix}.
$$
The system is inconsistent for any $\mathbf b$ with $b_1-\tfrac12 b_2+b_3\ne0$. So $A\mathbf x=\mathbf b$ is **not** consistent for all $\mathbf b$; it is solvable exactly when
$$b_1-\tfrac12 b_2+b_3=0,$$
a **plane through the origin** in $\mathbb R^3$ — precisely the set of linear combinations of the three columns of $A$. (The reason all-$\mathbf b$ existence fails: the echelon form of $A$ has a row of zeros.)

> **📐 THEOREM 4 — spanning $\mathbb R^m$.** Let $A$ be $m\times n$. The following are **logically equivalent** (for a given $A$, all true or all false):
> - **(a)** For each $\mathbf b\in\mathbb R^m$, the equation $A\mathbf x=\mathbf b$ has a solution.
> - **(b)** Each $\mathbf b\in\mathbb R^m$ is a linear combination of the columns of $A$.
> - **(c)** The columns of $A$ **span** $\mathbb R^m$.
> - **(d)** $A$ has a **pivot position in every row**.

> **🔎 Proof.**
> **(a) $\Leftrightarrow$ (b).** By the existence fact, for a *fixed* $\mathbf b$, "$A\mathbf x=\mathbf b$ has a solution" and "$\mathbf b$ is a linear combination of the columns of $A$" say the same thing. Quantifying "for each $\mathbf b\in\mathbb R^m$" on both sides gives (a) $\Leftrightarrow$ (b).
>
> **(b) $\Leftrightarrow$ (c).** "The columns of $A$ span $\mathbb R^m$" *means* Span$\{\mathbf a_1,\dots,\mathbf a_n\}=\mathbb R^m$, i.e. every $\mathbf b\in\mathbb R^m$ is a linear combination of $\mathbf a_1,\dots,\mathbf a_n$ — verbatim (b).
>
> **(a) $\Leftrightarrow$ (d).** Since (a),(b),(c) are already equivalent, it suffices to tie (a) to (d). Let $U$ be an echelon form of $A$. For any $\mathbf b\in\mathbb R^m$, row reduction gives $[\,A\ \mathbf b\,]\sim[\,U\ \mathbf d\,]$ for some $\mathbf d\in\mathbb R^m$.
> - *(d) true $\Rightarrow$ (a).* If every row of $U$ contains a pivot position, then each pivot lies in one of the first $n$ (coefficient) columns, so **no** pivot can lie in the augmented column. Thus $[\,U\ \mathbf d\,]$ never has a row $[\,0\ \cdots\ 0\ \mid\ b\,]$ with $b\ne0$; by the Existence & Uniqueness Theorem (§1.2) the system is consistent — for *every* $\mathbf b$. So (a) holds.
> - *(d) false $\Rightarrow$ (a) false.* If some row of $U$ has no pivot, the **last** row of $U$ is all zeros. Let $\mathbf d$ be the vector with $1$ in its last entry and $0$s elsewhere; then $[\,U\ \mathbf d\,]$ has the row $[\,0\ \cdots\ 0\ \mid\ 1\,]$ and is inconsistent. Because row operations are **reversible**, reversing them turns $[\,U\ \mathbf d\,]$ back into $[\,A\ \mathbf b\,]$ for a specific $\mathbf b$; that $A\mathbf x=\mathbf b$ is inconsistent too. So (a) fails.
>
> Hence (a) $\Leftrightarrow$ (d), and all four statements are equivalent. $\blacksquare$

> **⚠ Warning.** Theorem 4 is about the **coefficient matrix** $A$, not an augmented matrix. If $[\,A\ \mathbf b\,]$ happens to have a pivot in every row, $A\mathbf x=\mathbf b$ may or may not be consistent — that test is a statement about a single $\mathbf b$, not about spanning.

### Computing $A\mathbf x$ by hand — the row–vector rule

The column-combination definition is conceptual; for hand computation use rows.

#### Example 4 — the dot-product pattern (worked)

$$
\begin{bmatrix}2&3&4\\-1&5&-3\\6&-2&8\end{bmatrix}\begin{bmatrix}x_1\\x_2\\x_3\end{bmatrix}
=x_1\!\begin{bmatrix}2\\-1\\6\end{bmatrix}+x_2\!\begin{bmatrix}3\\5\\-2\end{bmatrix}+x_3\!\begin{bmatrix}4\\-3\\8\end{bmatrix}
=\begin{bmatrix}2x_1+3x_2+4x_3\\-x_1+5x_2-3x_3\\6x_1-2x_2+8x_3\end{bmatrix}.
$$
Each output entry is the "dot product" of a **row** of $A$ with $\mathbf x$.

> **📦 Row–Vector Rule for computing $A\mathbf x$.** If $A\mathbf x$ is defined, its $i$-th entry is the sum of the products of corresponding entries from **row $i$ of $A$** and from $\mathbf x$.

#### Example 5 — the identity matrix (worked)

$$
\begin{bmatrix}1&0&0\\0&1&0\\0&0&1\end{bmatrix}\begin{bmatrix}r\\s\\t\end{bmatrix}
=\begin{bmatrix}1\cdot r+0\cdot s+0\cdot t\\0\cdot r+1\cdot s+0\cdot t\\0\cdot r+0\cdot s+1\cdot t\end{bmatrix}
=\begin{bmatrix}r\\s\\t\end{bmatrix}.
$$
The matrix with $1$s on the diagonal and $0$s elsewhere is the **identity matrix** $I$ (the $n\times n$ one is $I_n$). It satisfies $I_n\mathbf x=\mathbf x$ for every $\mathbf x\in\mathbb R^n$.

### Algebra of the product

> **📐 THEOREM 5 — linearity of $\mathbf x\mapsto A\mathbf x$.** If $A$ is $m\times n$, $\mathbf u,\mathbf v\in\mathbb R^n$, and $c$ is a scalar, then
> $$\textbf{(a)}\ \ A(\mathbf u+\mathbf v)=A\mathbf u+A\mathbf v,\qquad\qquad \textbf{(b)}\ \ A(c\mathbf u)=c(A\mathbf u).$$

> **🔎 Proof (general $n$).** Write $A=[\,\mathbf a_1\ \cdots\ \mathbf a_n\,]$, $\mathbf u=(u_1,\dots,u_n)$, $\mathbf v=(v_1,\dots,v_n)$. The $i$-th entry of $\mathbf u+\mathbf v$ is $u_i+v_i$, so by the definition of the product and the vector-space axioms of $\mathbb R^m$,
> $$A(\mathbf u+\mathbf v)=\sum_{i=1}^n (u_i+v_i)\,\mathbf a_i=\sum_{i=1}^n\big(u_i\mathbf a_i+v_i\mathbf a_i\big)=\sum_{i=1}^n u_i\mathbf a_i+\sum_{i=1}^n v_i\mathbf a_i=A\mathbf u+A\mathbf v,$$
> using axiom 8, $(c+d)\mathbf a=c\mathbf a+d\mathbf a$, on each term, then axioms 2–3 (commutativity/associativity of addition) to regroup. For (b), the $i$-th entry of $c\mathbf u$ is $cu_i$, so
> $$A(c\mathbf u)=\sum_{i=1}^n (cu_i)\,\mathbf a_i=\sum_{i=1}^n c\,(u_i\mathbf a_i)=c\sum_{i=1}^n u_i\mathbf a_i=c\,(A\mathbf u),$$
> using axiom 9, $c(d\mathbf a)=(cd)\mathbf a$, then axiom 7, $c(\mathbf a+\mathbf b)=c\mathbf a+c\mathbf b$, to pull $c$ out of the sum. $\blacksquare$

> **💡 Foreshadowing.** Properties (a)–(b) are exactly the two conditions defining a **linear transformation** (§1.8). Every matrix $A$ gives a linear map $\mathbf x\mapsto A\mathbf x$, and — as we'll see — every linear map from $\mathbb R^n$ to $\mathbb R^m$ arises this way.

> **📝 Numerical Note.** To make computing $A\mathbf x$ fast, calculations should touch data stored in contiguous memory. Professional libraries (historically Fortran) store a matrix **by columns** and compute $A\mathbf x$ as a linear combination of columns; code in a row-major language (like C) should instead use the row–vector rule. Same answer, different memory access pattern.

---

### One-page recap

- A **vector equation** $x_1\mathbf a_1+\cdots+x_n\mathbf a_n=\mathbf b$, a **matrix equation** $A\mathbf x=\mathbf b$, and the **system** $[\,\mathbf a_1\ \cdots\ \mathbf a_n\ \mathbf b\,]$ are the same problem (Thm 3) — solve by row reduction.
- $\mathbf b$ is reachable **iff** $\mathbf b\in\text{Span}\{\text{columns of }A\}$.
- $A\mathbf x=\mathbf b$ solvable for **every** $\mathbf b$ **iff** the columns of $A$ span $\mathbb R^m$ **iff** $A$ has a pivot in every row (Thm 4) — a statement about $A$, not about any one $\mathbf b$.
- $\mathbf x\mapsto A\mathbf x$ is linear (Thm 5): it respects sums and scalar multiples.
