name: Lyceum
options:
  bundleIdPrefix: com.timpsonlyceum
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2" # 1 = iPhone, 2 = iPad (universal)
    GENERATE_INFOPLIST_FILE: YES
    # Baked in so `xcodegen generate` stops wiping the signing team (you had to
    # re-select it every regenerate). Change here if the team ever changes.
    DEVELOPMENT_TEAM: LGF933VBP2
    CODE_SIGN_STYLE: Automatic

targets:
  Lyceum:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    # Sign in with Apple requires a paid Apple Developer account, so it's disabled
    # to allow building to a device with a free Apple ID. Re-enable (and flip
    # appleSignInAvailable in AuthViews.swift) once enrolled in the paid program:
    #   entitlements:
    #     path: Lyceum.entitlements
    #     properties:
    #       com.apple.developer.applesignin:
    #         - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timpsonlyceum.Lyceum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Partial plist (App Transport Security); GENERATE_INFOPLIST_FILE merges
        # the generated launch/scene/orientation keys on top.
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Timpson Lyceum
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  LyceumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Lyceum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timpsonlyceum.LyceumTests

schemes:
  Lyceum:
    build:
      targets:
        Lyceum: all
        LyceumTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LyceumTests
