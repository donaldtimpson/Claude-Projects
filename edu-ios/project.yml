name: Lyceum
options:
  bundleIdPrefix: com.timpsonlyceum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2" # 1 = iPhone, 2 = iPad (universal)
    GENERATE_INFOPLIST_FILE: YES

targets:
  Lyceum:
    type: application
    platform: iOS
    sources:
      - path: Sources
    entitlements:
      path: Lyceum.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timpsonlyceum.Lyceum
        INFOPLIST_KEY_CFBundleDisplayName: Timpson Lyceum
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  LyceumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Lyceum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timpsonlyceum.LyceumTests

schemes:
  Lyceum:
    build:
      targets:
        Lyceum: all
        LyceumTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LyceumTests
