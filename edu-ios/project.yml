name: Lyceum
options:
  bundleIdPrefix: com.timpsonlyceum
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2" # 1 = iPhone, 2 = iPad (universal)
    GENERATE_INFOPLIST_FILE: YES
    # Baked in so `xcodegen generate` stops wiping the signing team (you had to
    # re-select it every regenerate). Change here if the team ever changes.
    DEVELOPMENT_TEAM: LGF933VBP2
    CODE_SIGN_STYLE: Automatic

targets:
  Lyceum:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    # Sign in with Apple requires a paid Apple Developer account, so it's disabled
    # to allow building to a device with a free Apple ID. Re-enable (and flip
    # appleSignInAvailable in AuthViews.swift) once enrolled in the paid program:
    #   entitlements:
    #     path: Lyceum.entitlements
    #     properties:
    #       com.apple.developer.applesignin:
    #         - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timpsonlyceum.Lyceum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Partial plist (App Transport Security); GENERATE_INFOPLIST_FILE merges
        # the generated launch/scene/orientation keys on top.
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Timpson Lyceum
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Device-specific orientations use Xcode's BUILD-SETTING suffix (_iPhone /
        # _iPad), not the Info.plist key suffix (~iphone / ~ipad). Spelled ~ipad,
        # the iPad line is silently ignored, iPad inherits the three iPhone
        # orientations, and — because the app targets iPad without
        # UIRequiresFullScreen — the build warns that multitasking needs all four.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  # Drives the app on a simulator and captures the App Store screenshots. Kept out
  # of the Lyceum scheme so a normal build/test run doesn't launch the UI; run it
  # with tools/screenshots.sh.
  LyceumScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Screenshots
    dependencies:
      - target: Lyceum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timpsonlyceum.LyceumScreenshots
        TEST_TARGET_NAME: Lyceum

  LyceumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Lyceum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timpsonlyceum.LyceumTests

schemes:
  LyceumScreenshots:
    build:
      targets:
        Lyceum: all
        LyceumScreenshots: [test]
    test:
      config: Debug
      targets:
        - LyceumScreenshots

  Lyceum:
    build:
      targets:
        Lyceum: all
        LyceumTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LyceumTests
